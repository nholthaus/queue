name: Create Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/cmake-multi-platform.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install documentation tools
        run: sudo apt-get update && sudo apt-get install -y doxygen texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra

      - name: Configure, build, and test
        run: |
          cmake -B ${{ github.workspace }}/build -DQUEUE_BUILD_TESTS=ON -DQUEUE_BUILD_DOCUMENTATION=ON -S ${{ github.workspace }}
          cmake --build ${{ github.workspace }}/build --parallel
          ctest --test-dir ${{ github.workspace }}/build --output-on-failure
          cmake --build ${{ github.workspace }}/build --target queue_documentation

      - name: Generate changelog
        run: npx --yes conventional-changelog-cli@5.0.0 -p angular -o CHANGELOG.md

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" CHANGELOG.md build/doc/latex/*.pdf --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
